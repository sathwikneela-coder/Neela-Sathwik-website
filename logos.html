<!DOCTYPE html>
<html lang="en" class="lenis">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logos | Sathwik Neela</title>
    <meta name="description" content="View the premium logo design and brand identity gallery by Sathwik Neela. Beautiful visual storytellers designed to captivate and convert.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            padding: 150px 0 50px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(212, 175, 55, 0.05), var(--bg-primary));
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 5rem;
        }

        .gallery-item {
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-secondary);
            aspect-ratio: 4/3;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
    <!-- GSAP & Lenis & Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
</head>

<body>
    <div id="webgl-container"></div>
    <div id="preloader"><div class="preloader-logo">SATHWIK.</div><div class="preloader-progress"><div class="preloader-bar"></div></div></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Sathwik<span>.</span></a>
            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html" class="active">Portfolio</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="testimonials.html">Testimonials</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Header -->
    <header class="page-header">
        <div class="container reveal">
            <h1 class="page-title">Logos <span>Gallery</span></h1>
            <p class="page-subtitle">A collection of my recent Logos projects.</p>
        </div>
    </header>

    <!-- Gallery Section -->
    <section class="section">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 2rem; gap: 1rem;">
                <a href="portfolio.html" class="back-link" style="margin-bottom: 0;"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
                <a href="https://drive.google.com/drive/folders/1YUHhlDVUDypCd29lf13VUBXtObLDKDQV?usp=sharing" target="_blank" class="btn btn-outline" style="padding: 0.5rem 1.5rem; font-size: 0.8rem; letter-spacing: 1px;"><i class="fab fa-google-drive" style="margin-right: 0.5rem; color: var(--accent-gold);"></i> View on Google Drive</a>
            </div>
            <div class="gallery-grid">
                <!-- Logo Cover Card -->
                <div class="gallery-item reveal">
                    <img src="images/logos_cover.png" alt="Logos Showcase Cover" style="width:100%; height:100%; object-fit: cover; display: block;">
                </div>
                <!-- Brand Logo Card -->
                <div class="gallery-item reveal">
                    <img src="images/logo.png" alt="Sathwik Brand Logo Design" style="width:100%; height:100%; object-fit: cover; display: block;">
                </div>
                <!-- Secondary Logo Card -->
                <div class="gallery-item reveal">
                    <img src="My image/logo.png" alt="Sathwik Creative Identity Logo" style="width:100%; height:100%; object-fit: cover; display: block;">
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <h2 class="logo" style="margin-bottom: 2rem;">Sathwik<span>.</span></h2>
            <div class="footer-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="services.html">Services</a>
            </div>
            <div class="social-links">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-behance"></i></a>
                <a href="#"><i class="fab fa-vimeo-v"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <p class="copyright">&copy; 2026 Sathwik Neela. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
